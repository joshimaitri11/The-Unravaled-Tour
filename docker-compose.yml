services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: unraveled_db
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-Password_123!}
    ports:
      - "${DB_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-Password_123!}' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-Password_123!}' -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: unraveled_db_init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./Database.sql:/tmp/Database.sql
    entrypoint: >
      bash -c "/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P '${MSSQL_SA_PASSWORD:-Password_123!}' -C -i /tmp/Database.sql || /opt/mssql-tools/bin/sqlcmd -S db -U sa -P '${MSSQL_SA_PASSWORD:-Password_123!}' -i /tmp/Database.sql"

  web:
    build: .
    container_name: unraveled_web
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - UNRAVELED_DB=Server=db,1433;Database=UnraveledTour;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Password_123!};TrustServerCertificate=True
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
