name: CI Build & Smoke Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Launch Application Stack
        run: |
          docker compose up --build -d || (docker compose logs && exit 1)

      - name: Wait for Containers to be Ready
        run: |
          echo "Waiting for services to become healthy..."
          for i in {1..40}; do
            if curl -s -f http://localhost:5000/Default.aspx > /dev/null; then
              echo "Web service is responding successfully!"
              exit 0
            fi
            echo "Waiting for web service... ($i/40)"
            sleep 3
          done
          echo "Web service failed to respond in time."
          docker compose logs
          exit 1

      - name: Smoke Test Web Forms Endpoint
        run: |
          response=$(curl -s http://localhost:5000/Default.aspx)
          if echo "$response" | grep -q "The Unraveled Tour"; then
            echo "Smoke test passed: Tour portal loaded properly."
          else
            echo "Smoke test failed: Expected content missing from response."
            echo "$response"
            exit 1
          fi

      - name: Tear Down Stack
        if: always()
        run: docker compose down -v
